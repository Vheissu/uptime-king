<div class="section-heading">
  <div>
    <h2>Response time</h2>
    <p>Hourly averages across all monitors.</p>
  </div>
  <span class="period-label">Last 24 hours<i class="ph ph-clock" aria-hidden="true"></i></span>
</div>
<div class="chart-key">
  <span></span>Average response<span class="chart-value"
    >{{ averageMs() ?? '—' }} <small>ms</small></span
  >
</div>
@if (points().length) {
  <svg
    class="response-chart"
    viewBox="0 0 680 210"
    role="img"
    aria-label="Average response time over the past 24 hours. Gaps indicate no recorded checks."
  >
    <title>Average response time over the past 24 hours</title>
    @for (y of [25, 75, 125, 175]; track y) {
      <line x1="42" [attr.y1]="y" x2="642" [attr.y2]="y" stroke="#e9eae6" stroke-dasharray="3 4" />
      <text x="0" [attr.y]="y + 4">{{ (chart().max * (175 - y)) / 150 | number: '1.0-0' }}</text>
    }
    @for (segment of chart().segments; track $index) {
      @if (segment.single; as point) {
        <circle [attr.cx]="point.x" [attr.cy]="point.y" r="4" fill="#398569" />
      } @else {
        <polygon [attr.points]="segment.area" fill="#e9f3ed" />
        <polyline
          [attr.points]="segment.points"
          fill="none"
          stroke="#398569"
          stroke-width="2.5"
          stroke-linejoin="round"
        />
      }
    }
    <text x="42" y="202">{{ chart().start | date: 'HH:mm' }}</text>
    <text x="600" y="202">{{ chart().end | date: 'HH:mm' }}</text>
  </svg>
} @else {
  <div class="empty-chart">No checks recorded in the past 24 hours.</div>
}
